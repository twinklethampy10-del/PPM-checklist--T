<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PPM Checklist</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f2f4f7;--card:#fff;--tx:#1c1e21;--mut:#667085;--bd:#d6dae0;--ac:#2b6cb0;--ac2:#fff;--bad:#d92d20;--badbg:#fdecea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101215;--card:#1b1e23;--tx:#eceef1;--mut:#9aa1ab;--bd:#343a42;--ac:#5aa9f5;--ac2:#06121f;--badbg:#3a1a18;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101215;--card:#1b1e23;--tx:#eceef1;--mut:#9aa1ab;--bd:#343a42;--ac:#5aa9f5;--ac2:#06121f;--badbg:#3a1a18;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,Helvetica,Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:12px}
.top{background:var(--ac);color:var(--ac2);border-radius:12px;padding:12px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.top b{font-size:22px}.top img{height:52px;border-radius:6px;background:#fff}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.card.bad{border:2px solid var(--bad);background:var(--badbg)}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.04em;color:var(--ac);margin:0 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px}
textarea{min-height:80px;margin-top:10px;display:none}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 16px;background:var(--ac);color:var(--ac2);min-height:44px}
button.s{background:transparent;color:var(--ac);border:1px solid var(--bd)}
button.sm{min-height:36px;padding:6px 12px;font-size:14px}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.seg button{flex:1;border-radius:0;background:var(--card);color:var(--mut);min-height:50px;font-size:16px;border-right:1px solid var(--bd)}
.seg button:last-child{border:0}
.seg .on{color:#fff}.seg .on.g{background:#2e9e4f}.seg .on.a{background:#f0a500;color:#222}.seg .on.r{background:var(--bad)}
.banner{display:none;background:var(--bad);color:#fff;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap}
.ph{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.ph div{border:1px solid var(--bd);border-radius:8px;padding:4px}
.ph img{width:100%;height:100px;object-fit:cover;border-radius:6px;display:block}
.ph button{width:100%;margin-top:4px;min-height:32px;padding:3px;font-size:13px}
canvas{width:100%;height:140px;background:#fff;border:1px dashed var(--bd);border-radius:8px;touch-action:none;display:block}
#msg{color:var(--mut);font-size:14px;margin:8px 0 24px}
.ft{display:flex;gap:10px}.ft button{flex:1;font-size:17px;padding:15px}
.ft .rs{background:transparent;color:var(--bad);border:1px solid var(--bad)}
</style>
</head>
<body>
<main>
<div class="top"><b>PPM Checklist</b><img id="logo" alt="JLL"></div>
<div class="banner" id="ban">Faulty asset flagged</div>

<div class="card"><h2>Details</h2><div class="g" id="det"></div></div>

<div class="card" id="stc"><h2>Asset condition</h2><div id="seg"></div><textarea id="cm" placeholder="Describe the fault and action required"></textarea></div>

<div class="card"><h2>Pictures</h2>
<div class="row"><button class="s sm" id="cam">Take picture</button><button class="s sm" id="lib">Choose pictures</button></div>
<input id="f1" type="file" accept="image/*" capture="environment" hidden>
<input id="f2" type="file" accept="image/*" multiple hidden>
<div class="ph" id="ph"></div></div>

<div class="card"><h2>Completed by</h2>
<div id="cb"></div>
<label style="margin-top:12px">Sign</label>
<canvas id="sg"></canvas>
<div class="row" style="margin-top:8px"><button class="s sm" id="clr">Clear signature</button></div></div>

<div class="ft"><button id="pdf">Convert to PDF</button><button class="rs" id="rst">Reset to New</button></div>
<div id="msg"></div>
</main>

const $=s=>document.querySelector(s);
const today=new Date().toISOString().slice(0,10);
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const x in a){if(x==='class')e.className=a[x];else if(x.startsWith('on'))e[x]=a[x];else e.setAttribute(x,a[x]);}k.flat().forEach(c=>e.append(c&&c.nodeType?c:document.createTextNode(c==null?'':c)));return e;};
let S={date:today,eng:'',wo:'',asset:'',st:null,cm:'',by:''};
try{const s=JSON.parse(localStorage.getItem('ppm26'));if(s&&s.date)S=s;}catch(e){}
let tm;const change=()=>{sync();clearTimeout(tm);tm=setTimeout(()=>{try{localStorage.setItem('ppm26',JSON.stringify(S));}catch(e){}},500);};
const inp=(k,t)=>{const i=h('input',{type:t||'text',oninput:e=>{S[k]=e.target.value;change();}});i.value=S[k]||'';return i;};
const fld=(l,el)=>h('div',{},h('label',{},l),el);
$('#logo').src=LOGO;
$('#det').append(fld('Date',inp('date','date')),fld('Engineers name',inp('eng')),fld('Work order number',inp('wo')),fld('Corrigo asset',inp('asset')));
$('#cb').append(fld('Name',inp('by')));

const OPT=[['Operational','g'],['Standby','a'],['Faulty','r']],seg=h('div',{class:'seg'});
OPT.forEach(([l,c])=>{const b=h('button',{type:'button',class:S.st===l?'on '+c:'',onclick:()=>{[...seg.children].forEach(x=>x.className='');b.className='on '+c;S.st=l;change();}},l);seg.append(b);});
$('#seg').append(seg);
$('#cm').value=S.cm||'';$('#cm').oninput=e=>{S.cm=e.target.value;change();};
function sync(){const f=S.st==='Faulty';$('#cm').style.display=f?'block':'none';$('#stc').classList.toggle('bad',f);$('#ban').style.display=f?'block':'none';$('#ban').textContent='Faulty: '+(S.asset||'asset')+(S.wo?' (WO '+S.wo+')':'');}
sync();

// photos
let photos=[];
const shrink=f=>new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res({data:c.toDataURL('image/jpeg',.8),w:c.width,h:c.height});};im.src=r.result;};r.readAsDataURL(f);});
const drawPh=()=>{const b=$('#ph');b.innerHTML='';photos.forEach((p,i)=>b.append(h('div',{},h('img',{src:p.data}),h('button',{class:'s',onclick:()=>{photos.splice(i,1);drawPh();}},'Remove'))));};
const add=async fs=>{for(const f of fs)photos.push(await shrink(f));drawPh();};
$('#cam').onclick=()=>$('#f1').click();$('#lib').onclick=()=>$('#f2').click();
$('#f1').onchange=e=>{add(e.target.files);e.target.value='';};$('#f2').onchange=e=>{add(e.target.files);e.target.value='';};

// signature
const cv=$('#sg'),cx=cv.getContext('2d'),dpr=window.devicePixelRatio||1,rc=cv.getBoundingClientRect();
cv.width=rc.width*dpr;cv.height=rc.height*dpr;cx.scale(dpr,dpr);cx.lineWidth=2.2;cx.lineCap='round';cx.strokeStyle='#111';
let dr=false,sg=false;const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
cv.onpointerdown=e=>{dr=true;cv.setPointerCapture(e.pointerId);cx.beginPath();cx.moveTo(...pos(e));};
cv.onpointermove=e=>{if(!dr)return;cx.lineTo(...pos(e));cx.stroke();sg=true;};
cv.onpointerup=cv.onpointercancel=()=>dr=false;
$('#clr').onclick=()=>{cx.clearRect(0,0,cv.width,cv.height);sg=false;};

// PDF
function build(){
 const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),W=210,M=15,B=[43,108,176];let y=34;
 doc.setFillColor(...B);doc.rect(0,0,W,26,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(20);doc.text('PPM Checklist',M,16);doc.addImage(LOGO,'PNG',W-M-27,3,27,20);
 const st=S.st==='Faulty'?{fillColor:[200,30,30],textColor:255,fontStyle:'bold'}:S.st==='Standby'?{fillColor:[255,192,0]}:S.st==='Operational'?{fillColor:[146,208,80]}:{};
 doc.autoTable({startY:y,theme:'grid',styles:{fontSize:10,cellPadding:2.5,textColor:20},columnStyles:{0:{cellWidth:55,fontStyle:'bold',fillColor:[220,230,245]}},margin:{left:M,right:M},
  body:[['Date',S.date],['Engineers name',S.eng||'-'],['Work order number',S.wo||'-'],['Corrigo asset',S.asset||'-'],['Condition',{content:S.st||'Not answered',styles:st}],...(S.st==='Faulty'?[['Fault / action required',S.cm||'-']]:[])]});
 y=doc.lastAutoTable.finalY+8;
 if(photos.length){if(y>230){doc.addPage();y=18;}doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...B);doc.text('PICTURES',M,y);y+=4;const bw=(W-2*M-6)/2,bh=70;
  photos.forEach((p,i)=>{const c=i%2;if(c===0&&y+bh+6>280){doc.addPage();y=18;}const x=M+c*(bw+6),k=Math.min(bw/p.w,bh/p.h),w=p.w*k,hh=p.h*k;doc.addImage(p.data,'JPEG',x+(bw-w)/2,y+(bh-hh)/2,w,hh);if(c===1||i===photos.length-1)y+=bh+5;});y+=3;}
 if(y>235){doc.addPage();y=18;}
 doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(...B);doc.text('COMPLETED BY',M,y);y+=4;
 if(sg)doc.addImage(cv.toDataURL('image/png'),'PNG',M,y,70,70*cv.height/cv.width);
 doc.setDrawColor(150);doc.line(M,y+32,M+75,y+32);doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(60);doc.text((S.by||'-')+'    '+S.date,M,y+37);
 return doc;}
$('#pdf').onclick=async()=>{const msg=$('#msg');msg.textContent='Creating PDF...';
 try{const doc=build(),name='PPM-Checklist-'+(S.wo||S.date)+'.pdf';
  doc.save(name);msg.textContent='PDF created.';
 }catch(e){msg.textContent='Could not create PDF: '+(e.message||e);}};
let armed=false;$('#rst').onclick=e=>{if(!armed){armed=true;e.target.textContent='Tap again to clear';setTimeout(()=>{armed=false;e.target.textContent='Reset to New';},4000);return;}
 try{localStorage.removeItem('ppm26');}catch(x){}location.reload();};
</script>
